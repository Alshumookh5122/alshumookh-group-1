<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تواصل معنا — ALSHUMOOKH</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f2027 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── Header ── */
    .chat-header {
      background: linear-gradient(135deg, #1e40af, #1d4ed8);
      border-radius: 16px 16px 0 0;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 4px 20px rgba(30,64,175,.4);
    }

    .chat-header-logo {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      flex-shrink: 0;
    }

    .chat-header-info h1 {
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .chat-header-info p {
      color: rgba(255,255,255,.7);
      font-size: 12px;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      background: #34d399;
      border-radius: 50%;
      display: inline-block;
      margin-left: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }

    /* ── Body ── */
    .chat-body {
      background: #fff;
      display: flex;
      flex-direction: column;
      height: 520px;
    }

    /* ── Start Form ── */
    #startForm {
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    #startForm h2 {
      font-size: 18px;
      color: #0f172a;
      font-weight: 800;
      margin-bottom: 4px;
    }

    #startForm p {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 8px;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: #344054;
    }

    input, textarea {
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      direction: inherit;
      outline: none;
      transition: border-color .2s;
      background: #f9fafb;
    }

    input:focus, textarea:focus {
      border-color: #1d4ed8;
      background: #fff;
    }

    textarea { resize: vertical; min-height: 80px; }

    .btn-send {
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px 24px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity .2s, transform .1s;
      width: 100%;
    }

    .btn-send:hover { opacity: .9; }
    .btn-send:active { transform: scale(.98); }
    .btn-send:disabled { opacity: .5; cursor: not-allowed; }

    /* ── Chat Messages ── */
    #chatView { display: none; flex-direction: column; height: 100%; }

    #messagesArea {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #f8fafc;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .msg.client {
      align-self: flex-end;
      background: linear-gradient(135deg, #1d4ed8, #1e40af);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.admin {
      align-self: flex-start;
      background: #fff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    .msg-time {
      font-size: 10px;
      opacity: .6;
      margin-top: 4px;
      text-align: right;
    }

    .msg.admin .msg-time { text-align: left; }

    /* ── Input area ── */
    .chat-input-area {
      padding: 14px 16px;
      border-top: 1px solid #e2e8f0;
      background: #fff;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .chat-input-area textarea {
      flex: 1;
      min-height: 42px;
      max-height: 120px;
      resize: none;
      border-radius: 10px;
      font-size: 14px;
    }

    .btn-send-small {
      background: #1d4ed8;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 20px;
      cursor: pointer;
      transition: opacity .2s;
      flex-shrink: 0;
      height: 42px;
    }

    .btn-send-small:hover { opacity: .85; }

    /* ── Footer ── */
    .chat-footer {
      background: #f1f5f9;
      border-radius: 0 0 16px 16px;
      padding: 10px 20px;
      text-align: center;
      font-size: 11px;
      color: #94a3b8;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 9999;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    /* ── Typing indicator ── */
    .typing { font-size: 12px; color: #64748b; padding: 4px 20px; min-height: 20px; }
  </style>
</head>
<body>

<div class="chat-wrapper">
  <!-- Header -->
  <div class="chat-header">
    <div class="chat-header-logo">SG</div>
    <div class="chat-header-info">
      <h1>ALSHUMOOKH GLOBAL BANKING <span class="online-dot"></span></h1>
      <p>فريق الدعم متاح للرد على استفساراتك</p>
    </div>
  </div>

  <!-- Body -->
  <div class="chat-body">

    <!-- Start Chat Form -->
    <div id="startForm">
      <div>
        <h2>ابدأ محادثة</h2>
        <p>أرسل استفسارك وسيرد عليك فريقنا في أقرب وقت</p>
      </div>

      <div class="form-row">
        <label>الاسم الكامل *
          <input id="clientName" placeholder="أحمد محمد" required>
        </label>
        <label>البريد الإلكتروني
          <input id="clientEmail" type="email" placeholder="ahmed@example.com">
        </label>
      </div>

      <label>الشركة / المؤسسة
        <input id="clientCompany" placeholder="اسم الشركة (اختياري)">
      </label>

      <label>موضوع الاستفسار
        <input id="chatSubject" placeholder="مثال: استفسار عن التحويل">
      </label>

      <label>رسالتك *
        <textarea id="firstMessage" placeholder="اكتب استفسارك هنا..."></textarea>
      </label>

      <button class="btn-send" onclick="startChat()">إرسال وبدء المحادثة ✉️</button>
    </div>

    <!-- Chat View -->
    <div id="chatView">
      <div id="messagesArea"></div>
      <div class="typing" id="typingIndicator"></div>
      <div class="chat-input-area">
        <textarea id="replyInput" placeholder="اكتب ردك..." rows="1"
          onkeydown="handleEnter(event)"></textarea>
        <button class="btn-send-small" onclick="sendReply()">➤</button>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="chat-footer">
    🔒 محادثتك آمنة ومحمية • ALSHUMOOKH GLOBAL BANKING FINANCE & CREDIT
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = '';
  let sessionId = localStorage.getItem('als_chat_session');
  let clientName = localStorage.getItem('als_chat_name') || '';
  let pollInterval = null;
  let lastMessageCount = 0;

  // ── Toast ──
  function showToast(msg, duration = 3000) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), duration);
  }

  // ── Time format ──
  function fmtTime(iso) {
    const d = new Date(iso);
    return d.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
  }

  // ── Render messages ──
  function renderMessages(messages) {
    const area = document.getElementById('messagesArea');
    area.innerHTML = '';
    messages.forEach(m => {
      const div = document.createElement('div');
      div.className = 'msg ' + m.sender;
      div.innerHTML = `<div>${escapeHtml(m.message)}</div><div class="msg-time">${fmtTime(m.created_at)}</div>`;
      area.appendChild(div);
    });
    area.scrollTop = area.scrollHeight;
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }

  // ── Poll for new messages ──
  async function pollMessages() {
    if (!sessionId) return;
    try {
      const r = await fetch(`${API}/api/v1/chat/session/${sessionId}/messages`);
      if (!r.ok) return;
      const data = await r.json();
      if (data.messages.length !== lastMessageCount) {
        lastMessageCount = data.messages.length;
        renderMessages(data.messages);
      }
    } catch (e) { /* ignore */ }
  }

  // ── Switch to chat view ──
  function showChatView() {
    document.getElementById('startForm').style.display = 'none';
    document.getElementById('chatView').style.display = 'flex';
    if (!pollInterval) {
      pollInterval = setInterval(pollMessages, 3000);
    }
    pollMessages();
  }

  // ── Start new chat ──
  async function startChat() {
    const name = document.getElementById('clientName').value.trim();
    const email = document.getElementById('clientEmail').value.trim();
    const company = document.getElementById('clientCompany').value.trim();
    const subject = document.getElementById('chatSubject').value.trim();
    const message = document.getElementById('firstMessage').value.trim();

    if (!name) { showToast('يرجى إدخال اسمك'); return; }
    if (!message) { showToast('يرجى كتابة رسالتك'); return; }

    const btn = document.querySelector('#startForm .btn-send');
    btn.disabled = true;
    btn.textContent = 'جارٍ الإرسال...';

    try {
      const r = await fetch(`${API}/api/v1/chat/start`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ client_name: name, client_email: email || null, client_company: company || null, subject: subject || null, message }),
      });

      if (!r.ok) throw new Error('فشل الإرسال');
      const data = await r.json();
      sessionId = data.session_id;
      clientName = name;
      localStorage.setItem('als_chat_session', sessionId);
      localStorage.setItem('als_chat_name', clientName);
      showChatView();
      pollMessages();
      showToast('تم إرسال رسالتك بنجاح ✅');
    } catch (e) {
      showToast('حدث خطأ، يرجى المحاولة مجدداً');
    } finally {
      btn.disabled = false;
      btn.textContent = 'إرسال وبدء المحادثة ✉️';
    }
  }

  // ── Reply ──
  async function sendReply() {
    const input = document.getElementById('replyInput');
    const message = input.value.trim();
    if (!message || !sessionId) return;

    input.value = '';
    input.style.height = 'auto';

    try {
      await fetch(`${API}/api/v1/chat/reply`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, client_name: clientName, message }),
      });
      await pollMessages();
    } catch (e) {
      showToast('تعذر الإرسال، يرجى المحاولة');
    }
  }

  // ── Enter to send ──
  function handleEnter(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendReply();
    }
  }

  // ── Auto-resize textarea ──
  document.addEventListener('DOMContentLoaded', () => {
    const ri = document.getElementById('replyInput');
    if (ri) {
      ri.addEventListener('input', () => {
        ri.style.height = 'auto';
        ri.style.height = Math.min(ri.scrollHeight, 120) + 'px';
      });
    }

    // Restore existing session
    if (sessionId) {
      showChatView();
    }
  });
</script>
</body>
</html>
