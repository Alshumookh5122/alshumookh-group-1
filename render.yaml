services:
  - type: web
    name: alshumookh-global-banking-api
    runtime: python
    buildCommand: pip install -r requirements.txt && python3 -c "import urllib.request,os; os.makedirs('app/static',exist_ok=True); urllib.request.urlretrieve('https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.1/ethers.umd.min.js','app/static/ethers.umd.min.js'); print('ethers.js downloaded OK')"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: PUBLIC_BASE_URL
        value: https://api.alshumookh-pay.com
      - key: ONRAMP_REDIRECT_URL
        value: https://api.alshumookh-pay.com/pay/success
      - key: CORS_ALLOWED_ORIGINS
        value: https://api.alshumookh-pay.com
      - key: HEALTH_ALLOWED_IPS
        value: 127.0.0.1,::1
  - type: worker
    name: alshumookh-global-banking-worker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A worker.celery_app worker -l info
