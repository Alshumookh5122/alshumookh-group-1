<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#e8eef6"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172232"/>
      <stop offset="1" stop-color="#0e1621"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d74e8"/>
      <stop offset="1" stop-color="#17479c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2,2 L12,7 L2,12 Z" fill="#1f5fd0"/>
    </marker>
    <style>
      .title{font:800 46px Arial,Tahoma,sans-serif;fill:#ffffff}
      .subtitle{font:400 22px Arial,Tahoma,sans-serif;fill:#c7d4e7}
      .eyebrow{font:900 18px Arial,Tahoma,sans-serif;fill:#d6b46c;letter-spacing:1px}
      .lane-title{font:900 24px Arial,Tahoma,sans-serif;fill:#111827}
      .lane-sub{font:400 16px Arial,Tahoma,sans-serif;fill:#667085}
      .step-no{font:900 18px Arial,Tahoma,sans-serif;fill:#ffffff}
      .step-title{font:900 22px Arial,Tahoma,sans-serif;fill:#101828}
      .step-text{font:400 16px Arial,Tahoma,sans-serif;fill:#667085}
      .small{font:700 14px Arial,Tahoma,sans-serif;fill:#667085}
      .status-title{font:900 18px Arial,Tahoma,sans-serif;fill:#101828}
      .status-text{font:400 14px Arial,Tahoma,sans-serif;fill:#667085}
      .mono{font:700 15px Consolas,Menlo,monospace;fill:#17479c}
      .icon-line{fill:none;stroke:#ffffff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .icon-dark{fill:none;stroke:#17479c;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <rect x="80" y="62" width="1760" height="190" rx="18" fill="url(#navy)" filter="url(#shadow)"/>
  <text x="1752" y="115" text-anchor="end" class="eyebrow">ALSHUMOOKH GLOBAL BANKING FINANCE &amp; CREDIT</text>
  <text x="1752" y="168" text-anchor="end" class="title">Master Wallet to Master Wallet Workflow</text>
  <text x="1752" y="212" text-anchor="end" class="subtitle">Technical process map from JSON file preparation to transaction confirmation and document issuance</text>

  <g transform="translate(108,302)">
    <rect x="0" y="0" width="356" height="610" rx="16" fill="#ffffff" stroke="#d8e0ea" filter="url(#shadow)"/>
    <circle cx="58" cy="58" r="30" fill="#fff6df" stroke="#c79a45"/>
    <path class="icon-dark" d="M45 49h26l10 10v28H45z M71 49v12h10 M53 69h20 M53 79h15"/>
    <text x="326" y="50" text-anchor="end" class="lane-title">Sender</text>
    <text x="326" y="80" text-anchor="end" class="lane-sub">Sender / Master Wallet Owner</text>

    <g transform="translate(34,135)">
      <rect width="288" height="128" rx="14" fill="#f8fafc" stroke="#d8e0ea"/>
      <circle cx="36" cy="36" r="18" fill="#1f5fd0"/><text x="36" y="43" text-anchor="middle" class="step-no">1</text>
      <text x="260" y="38" text-anchor="end" class="step-title">Prepare JSON File</text>
      <text x="260" y="70" text-anchor="end" class="step-text">Enter transfer details, asset, network,</text>
      <text x="260" y="96" text-anchor="end" class="step-text">amount, and external reference ID.</text>
    </g>

    <g transform="translate(34,315)">
      <rect width="288" height="128" rx="14" fill="#f8fafc" stroke="#d8e0ea"/>
      <circle cx="36" cy="36" r="18" fill="#1f5fd0"/><text x="36" y="43" text-anchor="middle" class="step-no">2</text>
      <text x="260" y="38" text-anchor="end" class="step-title">Upload File</text>
      <text x="260" y="70" text-anchor="end" class="step-text">Submit the file through the portal or API</text>
      <text x="260" y="96" text-anchor="end" class="step-text">using approved access credentials.</text>
    </g>
  </g>

  <g transform="translate(564,302)">
    <rect x="0" y="0" width="792" height="610" rx="16" fill="#ffffff" stroke="#d8e0ea" filter="url(#shadow)"/>
    <circle cx="58" cy="58" r="30" fill="#eaf2ff" stroke="#1f5fd0"/>
    <path class="icon-dark" d="M43 60l10 10 22-24 M42 83h34 M42 38h34"/>
    <text x="762" y="50" text-anchor="end" class="lane-title">ALSHUMOOKH Platform</text>
    <text x="762" y="80" text-anchor="end" class="lane-sub">ASG Platform / Validation / Ledger Records</text>

    <g transform="translate(34,135)">
      <rect width="340" height="128" rx="14" fill="#f8fafc" stroke="#d8e0ea"/>
      <circle cx="36" cy="36" r="18" fill="#1f5fd0"/><text x="36" y="43" text-anchor="middle" class="step-no">3</text>
      <text x="312" y="38" text-anchor="end" class="step-title">Validate Format &amp; Fields</text>
      <text x="312" y="70" text-anchor="end" class="step-text">Check JSON syntax, required fields,</text>
      <text x="312" y="96" text-anchor="end" class="step-text">network, asset, and wallet address.</text>
    </g>

    <g transform="translate(418,135)">
      <rect width="340" height="128" rx="14" fill="#f8fafc" stroke="#d8e0ea"/>
      <circle cx="36" cy="36" r="18" fill="#1f5fd0"/><text x="36" y="43" text-anchor="middle" class="step-no">4</text>
      <text x="312" y="38" text-anchor="end" class="step-title">Duplication &amp; Risk Check</text>
      <text x="312" y="70" text-anchor="end" class="step-text">Prevent duplicate external_id values</text>
      <text x="312" y="96" text-anchor="end" class="step-text">and apply internal compliance rules.</text>
    </g>

    <g transform="translate(34,315)">
      <rect width="340" height="128" rx="14" fill="#f8fafc" stroke="#d8e0ea"/>
      <circle cx="36" cy="36" r="18" fill="#1f5fd0"/><text x="36" y="43" text-anchor="middle" class="step-no">5</text>
      <text x="312" y="38" text-anchor="end" class="step-title">Create Pending Order</text>
      <text x="312" y="70" text-anchor="end" class="step-text">Generate Order ID, Payment Reference,</text>
      <text x="312" y="96" text-anchor="end" class="step-text">payment link, or invoice.</text>
    </g>

    <g transform="translate(418,315)">
      <rect width="340" height="128" rx="14" fill="#f8fafc" stroke="#d8e0ea"/>
      <circle cx="36" cy="36" r="18" fill="#1f5fd0"/><text x="36" y="43" text-anchor="middle" class="step-no">8</text>
      <text x="312" y="38" text-anchor="end" class="step-title">Confirm &amp; Close Order</text>
      <text x="312" y="70" text-anchor="end" class="step-text">Update the order status to Completed</text>
      <text x="312" y="96" text-anchor="end" class="step-text">and issue invoice and receipt.</text>
    </g>
  </g>

  <g transform="translate(1456,302)">
    <rect x="0" y="0" width="356" height="610" rx="16" fill="#ffffff" stroke="#d8e0ea" filter="url(#shadow)"/>
    <circle cx="58" cy="58" r="30" fill="#e7f6ef" stroke="#0f8a5f"/>
    <path class="icon-dark" d="M45 62c0-12 10-22 22-22s22 10 22 22-10 22-22 22-22-10-22-22z M67 40v44 M45 62h44"/>
    <text x="326" y="50" text-anchor="end" class="lane-title">Blockchain</text>
    <text x="326" y="80" text-anchor="end" class="lane-sub">Network Confirmation / TX Hash</text>

    <g transform="translate(34,135)">
      <rect width="288" height="128" rx="14" fill="#f8fafc" stroke="#d8e0ea"/>
      <circle cx="36" cy="36" r="18" fill="#1f5fd0"/><text x="36" y="43" text-anchor="middle" class="step-no">6</text>
      <text x="260" y="38" text-anchor="end" class="step-title">Execute Transfer</text>
      <text x="260" y="70" text-anchor="end" class="step-text">Send the amount from the Master Wallet</text>
      <text x="260" y="96" text-anchor="end" class="step-text">to the approved Ledger wallet.</text>
    </g>

    <g transform="translate(34,315)">
      <rect width="288" height="128" rx="14" fill="#f8fafc" stroke="#d8e0ea"/>
      <circle cx="36" cy="36" r="18" fill="#1f5fd0"/><text x="36" y="43" text-anchor="middle" class="step-no">7</text>
      <text x="260" y="38" text-anchor="end" class="step-title">Submit TX Hash</text>
      <text x="260" y="70" text-anchor="end" class="step-text">Attach the hash to the order and match</text>
      <text x="260" y="96" text-anchor="end" class="step-text">address, amount, and network.</text>
    </g>
  </g>

  <path d="M430 500 C500 500 510 500 564 500" stroke="#1f5fd0" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M938 500 C956 500 964 500 980 500" stroke="#1f5fd0" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1322 500 C1382 500 1405 500 1456 500" stroke="#1f5fd0" stroke-width="5" fill="none" marker-end="url(#arrow)"/>
  <path d="M1600 745 C1502 845 1324 846 1162 745" stroke="#1f5fd0" stroke-width="5" fill="none" marker-end="url(#arrow)"/>

  <g transform="translate(110,950)">
    <rect width="1700" height="74" rx="14" fill="#ffffff" stroke="#d8e0ea"/>
    <text x="1668" y="29" text-anchor="end" class="status-title">Status Flow:</text>
    <text x="1510" y="29" text-anchor="middle" class="mono">CREATED</text>
    <text x="1360" y="29" text-anchor="middle" class="small">File received</text>
    <path d="M1298 24h-80" stroke="#1f5fd0" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1140" y="29" text-anchor="middle" class="mono">PENDING</text>
    <text x="990" y="29" text-anchor="middle" class="small">Awaiting transfer</text>
    <path d="M928 24h-80" stroke="#1f5fd0" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="770" y="29" text-anchor="middle" class="mono">PROCESSING</text>
    <text x="590" y="29" text-anchor="middle" class="small">TX Hash under review</text>
    <path d="M500 24h-80" stroke="#1f5fd0" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="330" y="29" text-anchor="middle" class="mono">COMPLETED</text>
    <text x="180" y="29" text-anchor="middle" class="small">Receipt issued</text>
    <text x="1668" y="57" text-anchor="end" class="status-text">If the amount, network, or wallet address does not match, the order is marked Failed with a rejection reason.</text>
  </g>
</svg>
